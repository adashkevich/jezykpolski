<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Two variants so the browser chrome (status bar / URL bar) matches whichever theme
         `prefers-color-scheme` actually renders (see globals.css) rather than always the
         dark value — light's --background is pure white (oklch(1 0 0)). -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Polski — офлайн-приложение для изучения польского языка: словарь, склонения, спряжения и интервальные повторения."
    />
    <title>Polski — изучение польского</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
