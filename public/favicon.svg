<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="flagRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444" />
            <stop offset="100%" stop-color="#DC2626" />
        </linearGradient>
        <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
        </filter>
    </defs>

    <!-- Squircle фон -->
    <rect fill="#0F172A" width="64" height="64" rx="15" />
    <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />

    <!-- 4 Квадрата (Польский флаг) -->
    <g filter="url(#tileShadow)">
        <rect x="14" y="14" width="16" height="16" rx="4" fill="#FFFFFF" />
        <rect x="34" y="14" width="16" height="16" rx="4" fill="#FFFFFF" />
        <circle cx="42" cy="22" r="2.3" fill="#DC2626" />
        <rect x="14" y="34" width="16" height="16" rx="4" fill="url(#flagRed)" />
        <rect x="34" y="34" width="16" height="16" rx="4" fill="url(#flagRed)" />
    </g>
</svg>